name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist"
  SCRIPT: "demo/run.php"

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.os }} - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: 全てのPHPバージョンでテスト
          - os: ubuntu-latest
            php-version: 8.1
            dependencies: highest
          - os: ubuntu-latest
            php-version: 8.2
            dependencies: lowest
          - os: ubuntu-latest
            php-version: 8.2
            dependencies: highest
          - os: ubuntu-latest
            php-version: 8.3
            dependencies: lowest
          - os: ubuntu-latest
            php-version: 8.3
            dependencies: highest
          - os: ubuntu-latest
            php-version: 8.4
            dependencies: lowest
          - os: ubuntu-latest
            php-version: 8.4
            dependencies: highest
          - os: windows-latest
            php-version: 8.4
            dependencies: lowest
          - os: windows-latest
            php-version: 8.4
            dependencies: highest
          - os: macos-latest
            php-version: 8.4
            dependencies: lowest
          - os: macos-latest
            php-version: 8.4
            dependencies: highest

    services:
      redis:
        image: redis
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1
          tools: composer

      - name: Start Redis on Windows
        if: runner.os == 'Windows'
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri https://github.com/microsoftarchive/redis/releases/download/win-3.0.504/Redis-x64-3.0.504.zip -OutFile redis.zip
          Expand-Archive redis.zip -DestinationPath redis
          Start-Process redis/redis-server.exe -WindowStyle Hidden
          Start-Sleep 5

      - name: Start Redis on macOS
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
          sleep 5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Configure dependency resolution
        run: |
          composer config platform --unset

      - name: Update dependencies
        run: composer update ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} ${{ env.COMPOSER_FLAGS }}

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true

      - name: Prepare and run demo
        if: ${{ env.SCRIPT != '' && matrix.os == 'ubuntu-latest' }}
        run: |
          composer require doctrine/cache:"^1.12" --no-update
          composer update ${{ env.COMPOSER_FLAGS }}
          php ${{ env.SCRIPT }}
