name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
  workflow_dispatch:

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist"
  SCRIPT: "demo/run.php"

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.os }} - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: Test all PHP versions
          - os: ubuntu-latest
            php-version: "8.1"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.2"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.2"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.3"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.3"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.4"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.4"
            dependencies: highest
          # Windows: Latest PHP only for CI speed
          - os: windows-latest
            php-version: "8.4"
            dependencies: lowest
          - os: windows-latest
            php-version: "8.4"
            dependencies: highest
          # macOS: Latest PHP only for CI speed
          - os: macos-latest
            php-version: "8.4"
            dependencies: lowest
          - os: macos-latest
            php-version: "8.4"
            dependencies: highest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Redis (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Manual Redis setup for consistent behavior across OS
          sudo apt-get update -qq
          sudo apt-get install -y redis-server redis-tools
          sudo systemctl start redis-server
          redis-cli ping

      - name: Setup Redis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Manual Redis setup for Windows CI
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://github.com/microsoftarchive/redis/releases/download/win-3.0.504/Redis-x64-3.0.504.zip" -OutFile "redis.zip"
          Expand-Archive "redis.zip" -DestinationPath "redis"
          Start-Process -FilePath "redis/redis-server.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          redis/redis-cli.exe ping

      - name: Setup Redis (macOS)
        if: runner.os == 'macOS'
        run: |
          # Manual Redis setup for macOS CI
          brew install redis
          brew services start redis
          sleep 8
          redis-cli ping

      - name: Install Memcached (macOS)
        if: runner.os == 'macOS'
        run: |
          # Install and start Memcached service using Homebrew
          brew install memcached
          brew services start memcached
          sleep 5 # Give the service a moment to start

      - name: Install and Run Memcached (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Stop relying on unstable Chocolatey packages.
          # We will download and run Memcached manually for maximum reliability.
          $memcachedUrl = "https://github.com/jefyt/memcached-windows/releases/download/v1.6.22/memcached-1.6.22-win64.zip"
          $memcachedZip = "memcached.zip"
          $memcachedDir = "memcached"
          
          Write-Host "Downloading Memcached from $memcachedUrl"
          Invoke-WebRequest -Uri $memcachedUrl -OutFile $memcachedZip
          
          Write-Host "Extracting $memcachedZip to $memcachedDir"
          Expand-Archive -Path $memcachedZip -DestinationPath $memcachedDir
          
          Write-Host "Starting Memcached process in the background"
          # Start memcached.exe as a background process. It will listen on localhost:11211 by default.
          Start-Process -FilePath "$memcachedDir\memcached.exe" -ArgumentList "-m 64" -WindowStyle Hidden
          
          # Give it a moment to initialize
          Start-Sleep -Seconds 5
          
          Write-Host "Verifying Memcached process and port..."
          # Verify that the process is running
          Get-Process -Name "memcached"
          # Verify that the port is listening (critical check)
          netstat -an | findstr "11211"

      - name: Install Memcached (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Install and start Memcached service using apt-get
          sudo apt-get install -y memcached
          sudo systemctl start memcached

      # --- PHP and Dependencies Setup ---

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1
          tools: composer
          # 'memcached' extension is installed here for all OSs
          extensions: redis, memcached

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: |
          composer config platform --unset
          composer update ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} ${{ env.COMPOSER_FLAGS }}

      # --- Testing and Reporting ---

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4' && matrix.dependencies == 'highest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Run demo script
        if: env.SCRIPT != '' && matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4' && matrix.dependencies == 'highest'
        run: |
          composer require doctrine/cache:"^1.12" --no-update
          composer update ${{ env.COMPOSER_FLAGS }}
          php ${{ env.SCRIPT }}
