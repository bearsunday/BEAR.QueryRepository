name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
  workflow_dispatch:

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist"
  SCRIPT: "demo/run.php"

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.os }} - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: Test all PHP versions
          - os: ubuntu-latest
            php-version: "8.1"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.2"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.2"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.3"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.3"
            dependencies: highest
          - os: ubuntu-latest
            php-version: "8.4"
            dependencies: lowest
          - os: ubuntu-latest
            php-version: "8.4"
            dependencies: highest
          # Windows: Latest PHP only for CI speed
          - os: windows-latest
            php-version: "8.4"
            dependencies: lowest
          - os: windows-latest
            php-version: "8.4"
            dependencies: highest
          # macOS: Latest PHP only for CI speed
          - os: macos-latest
            php-version: "8.4"
            dependencies: lowest
          - os: macos-latest
            php-version: "8.4"
            dependencies: highest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Redis (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server redis-tools
          sudo systemctl start redis-server
          redis-cli ping

      - name: Setup Redis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://github.com/microsoftarchive/redis/releases/download/win-3.0.504/Redis-x64-3.0.504.zip" -OutFile "redis.zip"
          Expand-Archive "redis.zip" -DestinationPath "redis"
          Start-Process -FilePath "redis/redis-server.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          redis/redis-cli.exe ping

      - name: Setup Redis (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
          sleep 8
          redis-cli ping

      - name: Install Memcached (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install memcached
          brew services start memcached
          sleep 5

      - name: Download, Extract, and Start Memcached (Using Correct Parameters)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # 1. ダウンロードと展開
          curl.exe -L -o memcached.zip "https://github.com/jefyt/memcached-windows/releases/download/1.6.8_mingw/memcached-1.6.8-win64-mingw.zip"
          Expand-Archive -Path memcached.zip -DestinationPath memcached_files

          # 展開完了を待ちます
          Start-Sleep -Seconds 5

          # 2. 実行ファイルのパスをハードコード
          $execPath = ".\memcached_files\memcached-1.6.8-win64-mingw\bin\memcached.exe"
          
          # 3. サービスのインストールと起動
          #    お客様が以前示してくださった、--service-name を含む、正しいコマンドを使用します。
          Write-Host "Installing service with explicit name..."
          & $execPath -d install --service-name=memcached
          
          Write-Host "Starting the service..."
          & $execPath -d start --service-name=memcached

          # 4. 確認
          Start-Sleep -Seconds 5
          Write-Host "Verifying service status..."
          sc.exe query memcached

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1
          tools: composer
          extensions: redis, memcached

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: |
          composer config platform --unset
          composer update ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} ${{ env.COMPOSER_FLAGS }}

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4' && matrix.dependencies == 'highest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Run demo script
        if: env.SCRIPT != '' && matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4' && matrix.dependencies == 'highest'
        run: |
          composer require doctrine/cache:"^1.12" --no-update
          composer update ${{ env.COMPOSER_FLAGS }}
          php ${{ env.SCRIPT }}
